name: Deploy MNM

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::448795058116:role/MNM-GitHub-Deploy
          aws-region: us-east-2

      - name: Test AWS authentication
        run: aws sts get-caller-identity
      
      - name: Deploy to S3
        run: aws s3 sync dist/ s3://mnm-frontend-prod-2026 --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EDFX7JH31VO3Q --paths "/index.html"